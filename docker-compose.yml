services:
  postgres:
    image: postgres:15
    container_name: uptick_postgres
    environment:
      POSTGRES_USER: uptick_user
      POSTGRES_PASSWORD: uptick_password
      POSTGRES_DB: leadlag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
